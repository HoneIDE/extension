[package]
name = "hone-plugin-host"
version = "0.1.0"
edition = "2021"
description = "Hone plugin host — loads, manages, and dispatches hooks to native plugins"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
