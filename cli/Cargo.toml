[package]
name = "hone-plugin-cli"
version = "0.1.0"
edition = "2021"
description = "Hone plugin CLI — scaffold, build, test, and package plugins"

[[bin]]
name = "hone-plugin"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
hone-plugin-host = { path = "../host" }
serde_json = "1.0"
